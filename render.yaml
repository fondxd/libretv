services:
  - type: web
    name: libretv
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: PASSWORD
        value: "admin123"
      - key: DEFAULT_RECOMMEND_SOURCE
        value: "douban"
      - key: DEFAULT_SUBSCRIPTIONS
        value: '["https://raw.githubusercontent.com/fondXD/libretv/main/sources.json"]'
      - key: LIVE_ALLOW_PRIVATE
        value: "0"
